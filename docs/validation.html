<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test record — Premier League Predictions</title>
<meta name="description" content="How every part of the Premier League prediction model was tested against past seasons and the bookmakers, including the ideas that failed.">
<meta name="theme-color" content="#1A0020">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--deep:#1A0020;--purple:#37003C;--pink:#FF2882;--cyan:#04F5FF;--lav:#C4AECC;--dim:#9C7FA6;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}
body{margin:0;color:#fff;font:15px/1.65 Inter,-apple-system,Segoe UI,Roboto,sans-serif;
  background:linear-gradient(170deg,var(--deep) 0%,var(--purple) 55%,#4E0055 100%) fixed}
.wrap{max-width:780px;margin:0 auto;padding:18px 16px 60px}
.back{font:600 14px 'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan);text-decoration:none}
h1{font:400 34px/1.1 Anton,Impact,sans-serif;margin:14px 0 6px}
h2{font:400 24px/1.2 Anton,Impact,sans-serif;margin:34px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
h3{font:700 17px Inter;margin:22px 0 8px}
p,li{color:#EDE3F1}
a{color:var(--cyan)}
code{background:rgba(255,255,255,.08);border-radius:4px;padding:1px 5px;font-size:13px}
pre{background:rgba(0,0,0,.25);border-radius:10px;padding:12px;overflow-x:auto;font-size:13px}
pre code{background:none;padding:0}
blockquote{margin:12px 0;padding:8px 14px;border-left:3px solid var(--pink);background:rgba(255,255,255,.05);border-radius:0 8px 8px 0}
.tw{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--lav);text-align:left;background:rgba(255,255,255,.05)}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
hr{border:0;border-top:1px solid var(--line);margin:28px 0}
#doc>h1:first-child{display:none}
.loading{color:var(--lav)}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./">← Predictions</a>
  <h1>The full test record</h1>
  <p class="loading" id="intro">Every part of the model was checked against seasons it had not seen, and compared with the bookmakers. Ideas that failed are recorded too.</p>
  <div id="doc"><p class="loading">Loading…</p></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
// VALIDATION.md is copied next to this page by every pipeline run (update.py)
fetch('VALIDATION.md?v=' + Date.now()).then(r => { if (!r.ok) throw 0; return r.text(); }).then(md => {
  const el = document.getElementById('doc');
  el.innerHTML = marked.parse(md);
  // wide tables scroll sideways on phones instead of squashing the page
  el.querySelectorAll('table').forEach(t => { const w = document.createElement('div'); w.className = 'tw';
    t.parentNode.insertBefore(w, t); w.appendChild(t); });
}).catch(() => {
  document.getElementById('doc').innerHTML = '<p>The test record could not be loaded. It is also on ' +
    '<a href="https://github.com/shanbhag003/pl-supercomputer/blob/main/VALIDATION.md">GitHub</a>.</p>';
});
</script>
</body>
</html>
