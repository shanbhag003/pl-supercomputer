<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Premier League Predictions 2026-27</title>
<meta name="description" content="A self-updating Premier League forecast. 20,000 simulations, refreshed after every gameweek.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#37003C; --deep:#1A0020; --pink:#FF2882;
    --cyan:#04F5FF; --green:#00FF85; --lav:#C4AECC; --line:rgba(255,255,255,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(70% 38% at 30% 0%, #4E0055 0%, rgba(78,0,85,0) 62%),
      linear-gradient(170deg,#1A0020 0%,var(--purple) 46%,#22002A 100%);
    background-attachment:fixed;
    color:#fff;font-family:Inter,-apple-system,Segoe UI,Roboto,sans-serif;
    min-height:100vh;padding:0 0 56px;
  }
  .wrap{max-width:780px;margin:0 auto;padding:0 16px}
  header{padding:30px 0 18px}
  h1{font-family:Anton,sans-serif;font-size:clamp(30px,7vw,44px);line-height:.98;
     letter-spacing:.5px}
  h1 .p{color:var(--pink);display:block}
  .gw{font-family:'Barlow Condensed',sans-serif;font-weight:700;
      font-size:17px;color:var(--cyan);letter-spacing:.6px;margin-top:10px;
      text-transform:uppercase}
  .stamp{font-size:13px;color:var(--lav);margin-top:8px;display:flex;
         flex-wrap:wrap;gap:8px;align-items:center}
  .tz{background:rgba(255,255,255,.09);border:1px solid var(--line);color:var(--lav);
      border-radius:99px;padding:3px 11px;font-size:12px;cursor:pointer;
      font-family:inherit}
  .tz:hover{background:rgba(255,255,255,.16);color:#fff}
  .next{font-size:13px;color:var(--lav);margin-top:6px;opacity:.85}

  .tabs{display:flex;gap:6px;margin-top:20px;background:rgba(255,255,255,.05);
        border:1px solid var(--line);border-radius:99px;padding:4px;width:max-content}
  .tab{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;
       letter-spacing:.7px;text-transform:uppercase;color:var(--lav);
       background:none;border:0;border-radius:99px;padding:7px 18px;cursor:pointer}
  .tab[aria-selected="true"]{background:var(--pink);color:#fff}
  .tab:disabled{opacity:.4;cursor:not-allowed}
  .hint{font-size:12.5px;color:var(--lav);margin-top:9px;line-height:1.55}
  .gap-up{color:var(--green);font-weight:600}
  .gap-dn{color:var(--pink);font-weight:600}
  .gap-0{color:var(--lav)}

  .card{background:rgba(255,255,255,.055);border:1px solid var(--line);
        border-radius:14px;padding:16px;margin-top:22px}
  .card h2{font-family:'Barlow Condensed',sans-serif;font-size:13px;
           letter-spacing:1.4px;color:var(--lav);text-transform:uppercase;
           font-weight:600;margin-bottom:12px}

  table{width:100%;border-collapse:collapse}
  th{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.9px;
     color:var(--lav);text-transform:uppercase;font-weight:600;padding:0 4px 9px;
     text-align:right}
  th.l{text-align:left}
  td{padding:9px 4px;font-size:14px;text-align:right;
     border-top:1px solid rgba(255,255,255,.07)}
  td.l{text-align:left;font-weight:600}
  .rk{color:var(--lav);font-size:12px;width:26px;text-align:center}
  .bar{display:inline-block;width:4px;height:15px;border-radius:2px;
       margin-right:8px;vertical-align:-2px}
  .g{color:var(--green);font-weight:600}
  .c{color:var(--cyan)}
  .pk{color:var(--pink);font-weight:600}
  .dim{color:#9C7FA6}
  tr.z4 .rk{color:var(--green)} tr.z6 .rk{color:var(--cyan)}
  tr.zr .rk{color:var(--pink)}

  .kv{display:flex;justify-content:space-between;padding:7px 0;font-size:14px;
      border-top:1px solid rgba(255,255,255,.07)}
  .kv:first-of-type{border-top:0}
  .kv span:first-child{color:var(--lav)}
  .kv span:last-child{font-weight:600}

  .mv{display:flex;justify-content:space-between;padding:7px 0;font-size:14px;
      border-top:1px solid rgba(255,255,255,.07)}
  .mv:first-of-type{border-top:0}
  .up{color:var(--green)} .dn{color:var(--pink)}

  details{margin-top:22px}
  summary{cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:13px;
          letter-spacing:1.4px;color:var(--lav);text-transform:uppercase;
          font-weight:600;padding:14px 0}
  .hm{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .hm table{min-width:640px}
  .hm td{padding:3px 1px;font-size:9px;text-align:center;border:0;color:#fff}
  .hm td.l{text-align:left;font-size:12px;padding-right:8px;white-space:nowrap;
           position:sticky;left:0;background:#2A0430}
  .hm th{padding:0 1px 5px;font-size:9px;text-align:center}
  footer{margin-top:30px;font-size:12px;color:var(--lav);line-height:1.65;
         opacity:.8;border-top:1px solid var(--line);padding-top:16px}
  footer a{color:var(--cyan)}
  .err{padding:26px;text-align:center;color:var(--lav)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>2026-27 Premier League<span class="p">My Predictions</span></h1>
    <div class="gw" id="gw">Loading…</div>
    <div class="stamp">
      <span id="stamp"></span>
      <button class="tz" id="tzbtn" type="button"></button>
    </div>
    <div class="next" id="next"></div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" id="t-pred" role="tab" aria-selected="true">Predicted</button>
    <button class="tab" id="t-act"  role="tab" aria-selected="false">Actual</button>
  </div>
  <div class="hint" id="hint"></div>

  <div id="app"></div>

  <footer>
    Expected-goals ratings, plus-minus player values and 20,000 Monte Carlo
    simulations. Squads, injuries and suspensions from the official FPL API.
    <br>Updates automatically twelve hours after every gameweek ends.
    <br><a href="https://github.com/shanbhag003/pl-supercomputer">Code and full method on GitHub</a>
  </footer>
</div>

<script>
const CLUB={"Arsenal":"#EF0107","Manchester City":"#6CABDD","Liverpool":"#C8102E",
"Manchester United":"#DA291C","Bournemouth":"#DA291C","Aston Villa":"#95BFE5",
"Newcastle United":"#41535F","Brighton":"#0057B8","Chelsea":"#034694",
"Leeds":"#FFCD00","Brentford":"#E30613","Crystal Palace":"#1B458F",
"Nottingham Forest":"#DD0000","Tottenham":"#4A5D8F","Everton":"#003399",
"Fulham":"#CC0000","Sunderland":"#EB172B","Hull":"#F5A12D","Coventry":"#78D0F3",
"Ipswich":"#0044A9"};
const SHORT={"Manchester City":"Man City","Manchester United":"Man United",
"Newcastle United":"Newcastle","Nottingham Forest":"Nott'm Forest"};

// Browser timezone by default; UTC one tap away, because a screenshot of a
// local-time page is confusing to everyone who isn't in that timezone.
const localZone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Local';
let useUTC = localStorage.getItem('plzone') === 'utc';
let DATA = null;
let TAB = 'pred';   // predicted by default; actual is one tap away

const pct = v => v*100 < 0.05 ? '—' : (v*100).toFixed(1) + '%';
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function fmt(iso){
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  const o = {day:'numeric', month:'short', year:'numeric',
             hour:'2-digit', minute:'2-digit', hour12:false,
             timeZone: useUTC ? 'UTC' : undefined};
  const p = new Intl.DateTimeFormat('en-GB', o).formatToParts(d);
  const g = t => (p.find(x => x.type === t) || {}).value;
  return `${g('day')} ${g('month')} ${g('year')}, ${g('hour')}:${g('minute')}`;
}
const zoneLabel = () => useUTC ? 'UTC'
  : (localZone.split('/').pop() || 'local').replace('_',' ');

function paintStamp(){
  document.getElementById('stamp').textContent =
    'Updated ' + fmt(DATA.updated_utc) + ' ' + zoneLabel();
  document.getElementById('tzbtn').textContent = useUTC ? 'Show my time' : 'Show UTC';
  const n = document.getElementById('next');
  n.textContent = DATA.next_update_utc
    ? `Next update after Gameweek ${DATA.next_gameweek} — expected ${fmt(DATA.next_update_utc)} ${zoneLabel()}`
    : 'Season complete.';
}

function heat(v){
  if (v < 0.005) return 'transparent';
  return `rgba(255,40,130,${Math.min(0.92, 0.10 + v*2.6).toFixed(3)})`;
}

function tablePredicted(){
  const d = DATA, T = d.teams.length;
  let h = '<div class="card"><h2>Projected final table</h2><table>'
    + '<tr><th></th><th class="l">Team</th><th>Pts</th><th>Title</th>'
    + '<th>Top 4</th><th>Releg</th></tr>';
  d.teams.forEach(t => {
    const z = t.pos <= 4 ? 'z4' : t.pos <= 6 ? 'z6' : t.pos > T-3 ? 'zr' : '';
    h += `<tr class="${z}"><td class="rk">${t.pos}</td>`
      + `<td class="l"><span class="bar" style="background:${CLUB[t.team]||'#888'}"></span>`
      + `${esc(SHORT[t.team]||t.team)}</td>`
      + `<td>${t.xPts.toFixed(1)}</td>`
      + `<td class="${t.title>=.25?'g':t.title>=.08?'c':t.title>=.01?'':'dim'}">${pct(t.title)}</td>`
      + `<td class="${t.top4>=.25?'g':t.top4>=.08?'c':'dim'}">${pct(t.top4)}</td>`
      + `<td class="${t.releg>=.15?'pk':t.releg>=.03?'':'dim'}">${pct(t.releg)}</td></tr>`;
  });
  h += '</table></div>';
  return h;
}

function tableActual(){
  const d = DATA, T = d.teams.length;
  // where the model thinks each club finishes, for the comparison column
  const proj = {}; d.teams.forEach(t => proj[t.team] = t.pos);
  let h = '<div class="card"><h2>Current standings</h2><table>'
    + '<tr><th></th><th class="l">Team</th><th>P</th><th>W</th><th>D</th>'
    + '<th>L</th><th>GD</th><th>Pts</th><th>Proj</th></tr>';
  d.actual.forEach(t => {
    const z = t.pos <= 4 ? 'z4' : t.pos <= 6 ? 'z6' : t.pos > T-3 ? 'zr' : '';
    const pj = proj[t.team], diff = t.pos - pj;   // + means model expects a climb
    const cls = diff > 0 ? 'gap-up' : diff < 0 ? 'gap-dn' : 'gap-0';
    const arrow = diff > 0 ? '▲' : diff < 0 ? '▼' : '–';
    h += `<tr class="${z}"><td class="rk">${t.pos}</td>`
      + `<td class="l"><span class="bar" style="background:${CLUB[t.team]||'#888'}"></span>`
      + `${esc(SHORT[t.team]||t.team)}</td>`
      + `<td>${t.P}</td><td>${t.W}</td><td>${t.D}</td><td>${t.L}</td>`
      + `<td>${t.GD > 0 ? '+' : ''}${t.GD}</td><td><b>${t.Pts}</b></td>`
      + `<td class="${cls}">${pj} ${arrow}</td></tr>`;
  });
  h += '</table><div class="hint">The <b>Proj</b> column is where the model '
    + 'expects each club to finish. Green means it expects them to climb, pink '
    + 'to fall.</div></div>';
  return h;
}

function render(){
  const d = DATA;
  document.getElementById('gw').textContent = d.label;
  paintStamp();

  const started = d.matches_played > 0;
  const actBtn = document.getElementById('t-act');
  actBtn.disabled = !started;
  if (!started) { TAB = 'pred'; }
  document.getElementById('hint').textContent = started ? ''
    : 'The season has not started, so there are no actual standings yet.';

  let h = TAB === 'act' ? tableActual() : tablePredicted();

  const v = d.validation;
  h += '<div class="card"><h2>How accurate has this been?</h2>';
  if (!v || !v.n) {
    h += '<div style="color:var(--lav);font-size:14px;line-height:1.6">'
      + 'No score yet. Only predictions made <i>before</i> a match was played are '
      + 'graded, so the first scores appear once a forecast gameweek has been played.'
      + '</div>';
  } else {
    const rows = [['Matches predicted', v.n],
      ['Results called correctly', (v.hit*100).toFixed(0) + '%'],
      ['Sharpness score (lower is better)', v.rps.toFixed(3)]];
    if (v.bookie_rps){
      const gap = 100*(v.rps/v.bookie_rps - 1);
      rows.push(['Bookmakers, same matches', v.bookie_rps.toFixed(3)]);
      rows.push(['Versus the market',
        Math.abs(gap).toFixed(1) + '% ' + (gap > 0 ? 'behind' : 'ahead')]);
    }
    rows.forEach(r => h += `<div class="kv"><span>${r[0]}</span><span>${r[1]}</span></div>`);
    h += '<div style="color:var(--lav);font-size:12px;margin-top:10px">'
      + 'Nothing here is graded with hindsight.</div>';
  }
  h += '</div>';

  const mv = (d.moves||[]).filter(m => Math.abs(m.d_xPts) >= 0.05);
  h += '<div class="card"><h2>What changed since last gameweek</h2>';
  if (!mv.length){
    h += '<div style="color:var(--lav);font-size:14px">Nothing moved by more than '
      + 'a rounding error.</div>';
  } else {
    mv.forEach(m => {
      const cls = m.d_xPts > 0 ? 'up' : 'dn';
      const sign = m.d_xPts > 0 ? '+' : '';
      h += `<div class="mv"><span>${esc(SHORT[m.team]||m.team)}</span>`
        + `<span class="${cls}">${sign}${m.d_xPts.toFixed(1)} pts</span></div>`;
    });
  }
  h += '</div>';

  h += '<details><summary>Chance of finishing in each position ▾</summary>'
    + '<div class="card hm" style="margin-top:0"><table><tr><th class="l"></th>';
  for (let i = 1; i <= T; i++) h += `<th>${i}</th>`;
  h += '</tr>';
  d.teams.forEach(t => {
    const row = d.position_matrix[t.team] || [];
    h += `<tr><td class="l">${esc(SHORT[t.team]||t.team)}</td>`;
    row.forEach(v => h += `<td style="background:${heat(v)}">`
      + `${v >= 0.10 ? Math.round(v*100) : ''}</td>`);
    h += '</tr>';
  });
  h += '</table><div style="color:var(--lav);font-size:12px;margin-top:10px">'
    + 'Percentage of 20,000 simulated seasons. Scroll sideways on mobile.'
    + '</div></div></details>';

  document.getElementById('app').innerHTML = h;
}

function setTab(t){
  TAB = t;
  document.getElementById('t-pred').setAttribute('aria-selected', t === 'pred');
  document.getElementById('t-act').setAttribute('aria-selected', t === 'act');
  if (DATA) render();
}
document.getElementById('t-pred').addEventListener('click', () => setTab('pred'));
document.getElementById('t-act').addEventListener('click', () => setTab('act'));

document.getElementById('tzbtn').addEventListener('click', () => {
  useUTC = !useUTC;
  localStorage.setItem('plzone', useUTC ? 'utc' : 'local');
  paintStamp();
});

// cache-buster: GitHub Pages caches hard, and a stale table is the worst bug
fetch('data.json?v=' + Date.now())
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(j => { DATA = j; render(); })
  .catch(e => {
    document.getElementById('gw').textContent = '';
    document.getElementById('app').innerHTML =
      '<div class="err">Could not load the latest forecast. '
      + 'If this persists the last run may have failed — '
      + 'check the Actions tab.</div>';
    console.error(e);
  });
</script>
</body>
</html>
