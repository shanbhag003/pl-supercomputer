<style>
/* Same identity as the live site - purple, pink, cyan, green - refined:
   one surface colour for cards, one radius, a clear type scale. */
:root{
  --deep:#1A0020; --purple:#37003C; --plum:#4E0055;
  --pink:#FF2882; --cyan:#04F5FF; --green:#00FF85; --lav:#C4AECC; --dim:#9C7FA6;
  --card:rgba(255,255,255,.055); --card2:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.10); --r:14px;
  --display:Anton,Impact,sans-serif; --label:'Barlow Condensed',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
html{background:var(--deep);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{color:#fff;font:15px/1.5 Inter,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
/* iOS ignores background-attachment:fixed, so the gradient sits on its own fixed layer */
body:before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;z-index:-1;pointer-events:none;
  background:radial-gradient(1200px 600px at 85% -10%,rgba(255,40,130,.18),transparent 60%),
             linear-gradient(170deg,var(--deep) 0%,var(--purple) 55%,var(--plum) 100%)}
*{-webkit-tap-highlight-color:transparent}
button{-webkit-appearance:none;appearance:none;font-family:inherit}
.wrap{max-width:780px;margin:0 auto;padding:0 16px 48px}
.mock{background:#FFE14D;color:#1A0020;font:600 12px/1.4 Inter;text-align:center;padding:6px 12px}

/* header */
header{padding:22px 0 10px}
.brand{font:600 13px var(--label);letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
h1{font:400 40px/1 var(--display);margin:6px 0 4px;letter-spacing:.01em}
h1 b{color:var(--pink);font-weight:400}
.meta{color:var(--lav);font-size:13px}
.meta b{color:#fff;font-weight:600}

/* tabs */
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:4px;margin:14px -16px 18px;padding:8px 16px;
  background:rgba(26,0,32,.88);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tab{flex:1;background:none;border:0;color:var(--lav);font:600 15px var(--label);letter-spacing:.08em;
  text-transform:uppercase;padding:10px 4px;border-radius:10px;cursor:pointer}
.tab[aria-selected=true]{color:#fff;background:var(--card2);box-shadow:inset 0 -3px 0 var(--pink)}
.tab .new{font-size:10px;background:var(--green);color:var(--deep);border-radius:4px;padding:1px 4px;margin-left:4px;vertical-align:2px}

/* building blocks */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.h2{font:600 13px var(--label);letter-spacing:.14em;text-transform:uppercase;color:var(--lav);margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline}
.h2 small{font:500 12px Inter;letter-spacing:0;text-transform:none;color:var(--dim)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--lav);border-radius:999px;
  padding:6px 12px;font:600 13px var(--label);letter-spacing:.06em;cursor:pointer}
.chip.on{background:#fff;color:var(--deep);border-color:#fff}
.chip[disabled]{opacity:.4;cursor:default}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:0}
.note{background:rgba(4,245,255,.08);border:1px solid rgba(4,245,255,.25);border-radius:10px;padding:10px 12px;font-size:13px;color:#E6F9FF;margin-bottom:12px}
.proto{background:rgba(255,225,77,.10);border-color:rgba(255,225,77,.35);color:#FFF3B8}

/* title race */
.race{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.racer{border-radius:12px;padding:12px;background:var(--card2);border-top:4px solid}
.racer .pct{font:400 34px/1 var(--display)}
.racer .nm{font:600 15px var(--label);letter-spacing:.04em;text-transform:uppercase;margin-top:4px}
.racer .sub{font-size:12px;color:var(--lav)}
svg text{font-family:Inter;fill:var(--lav)}

/* table */
.row{display:grid;grid-template-columns:28px minmax(0,1fr) 44px 132px;gap:8px;align-items:center;
  padding:10px 6px;border-top:1px solid var(--line);cursor:pointer;position:relative}
.row:first-child{border-top:0}
.row:before{content:'';position:absolute;left:-16px;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--zone,transparent)}
.pos{font:400 18px var(--display);color:var(--lav);text-align:center}
.team{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team .sub{display:block;font-weight:400;font-size:12px;color:var(--dim)}
.xp{font:400 22px var(--display);text-align:right}
.odds{display:flex;gap:4px;justify-content:flex-end;font:600 13px var(--label);white-space:nowrap}
.odds span{width:41px;text-align:center;border-radius:6px;padding:3px 0;background:var(--card)}
.hdr{cursor:default;padding-top:0;font:600 12px var(--label);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.hdr .odds span{background:none;font:600 12px var(--label);letter-spacing:.04em;color:var(--dim)}
.odds .t{color:var(--green)} .odds .r{color:var(--pink)}
.rng{grid-column:2/5;height:6px;background:var(--card);border-radius:3px;position:relative;margin-top:-2px}
.rng i{position:absolute;top:0;bottom:0;border-radius:3px;opacity:.85}
.rng b{position:absolute;top:-3px;width:3px;height:12px;background:#fff;border-radius:2px}
.dist{grid-column:1/5;display:none;padding:8px 0 2px}
.row.open .dist{display:block}
.bars{display:flex;align-items:flex-end;gap:2px;height:60px}
.bars i{flex:1;background:var(--cyan);border-radius:2px 2px 0 0;min-height:1px}
.bars i.z1{background:var(--green)} .bars i.z3{background:var(--pink)}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:3px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--lav);margin-top:10px}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px}
table.cur{width:100%;border-collapse:collapse;font-size:14px}
table.cur th{font:600 12px var(--label);letter-spacing:.08em;color:var(--dim);text-align:right;padding:6px 4px}
table.cur td{padding:8px 4px;border-top:1px solid var(--line);text-align:right}
table.cur td:nth-child(2),table.cur th:nth-child(2){text-align:left}

/* moves */
.mv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.mv:first-of-type{border-top:0}
.mv em{display:block;font-style:normal;font-size:12px;color:var(--lav)}
.up{color:var(--green);font:400 20px var(--display)} .dn{color:var(--pink);font:400 20px var(--display)}

/* matches */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card2);border-radius:12px;padding:12px}
.stat b{display:block;font:400 26px/1.1 var(--display)}
.stat span{font-size:12px;color:var(--lav)}
.fx{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.fx .ko{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:8px}
.fx .teams{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.fx .teams div:last-child{text-align:right}
.fx .sc{font:400 22px var(--display);text-align:center;min-width:64px}
.fx .sc small{display:block;font:500 11px Inter;color:var(--dim)}
.pbar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:10px 0 4px}
.plab{display:flex;justify-content:space-between;font-size:12px;color:var(--lav)}
.res{font:600 12px var(--label);letter-spacing:.06em;border-radius:6px;padding:2px 8px}
.res.y{background:rgba(0,255,133,.15);color:var(--green)} .res.n{background:rgba(255,40,130,.15);color:var(--pink)}
.res.w{background:var(--card2);color:var(--lav)}
.tight{color:#FFE14D}

/* fpl */
.caps{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none}
.cap{flex:1 0 128px;min-width:128px;background:var(--card2);border-radius:12px;padding:12px;border-top:4px solid}
.cap .x{font:400 30px/1 var(--display)}
.cap .nm{font-weight:700;margin-top:4px}
.cap .sub{font-size:12px;color:var(--lav)}
.cap .sub,.cap .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl{width:100%;border-collapse:collapse;font-size:14px}
.pl th{font:600 12px var(--label);letter-spacing:.08em;color:var(--dim);text-align:right;padding:6px 4px;white-space:nowrap}
.pl td{padding:8px 4px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.pl td:first-child,.pl th:first-child{text-align:left}
.plw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.pl td:first-child .l1,.pl td:first-child .sub{white-space:nowrap}
.pl td:first-child .l1 b{display:inline-block;max-width:118px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
.flagbtn{border:0;cursor:pointer;margin-left:6px;font:600 11px var(--label);letter-spacing:.06em;text-transform:uppercase;
  border-radius:4px;padding:1px 5px;background:rgba(255,225,77,.15);color:#FFE14D;vertical-align:1px}
.toast{max-width:88vw;white-space:normal;text-align:center}
.show-s{display:none}
.rec{border-top:1px solid var(--line)}
.rec summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;padding:10px 0;font-size:13.5px;color:var(--lav)}
.rec summary::-webkit-details-marker{display:none}
.rec summary b{color:#fff;min-width:40px}
.rec summary i{font-style:normal;color:var(--dim)}
.rec summary em{font:700 13.5px Inter;font-style:normal}
.rec .act{font:400 18px var(--display)}
.rec .act.up{color:var(--green)} .rec .act.dn{color:var(--pink)}
.rec summary em.up{color:var(--green)} .rec summary em.dn{color:var(--pink)}
.rec[open] summary{color:#fff}
.rec .pl{margin-bottom:6px}

.sep:before{content:' · '}
.flagbtn.short{width:17px;height:17px;padding:0;border-radius:50%;font:700 11px/17px Inter;text-align:center}
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.zone{flex:none;display:inline-flex;padding:3px;border:1px solid var(--line);background:var(--card);border-radius:999px;cursor:pointer}
.zone span{font:600 12px var(--label);letter-spacing:.08em;color:var(--lav);padding:4px 10px;border-radius:999px;white-space:nowrap}
.zone span.on{background:#fff;color:var(--deep)}
.pl .sub{display:block;font-size:12px;color:var(--dim)}
.pl .xp{font:400 18px var(--display);color:var(--green)}
.tag{font:600 11px var(--label);letter-spacing:.06em;border-radius:4px;padding:1px 5px;background:var(--card2);color:var(--lav)}

/* about */
.step{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0}
.step .n{font:400 28px/1 var(--display);color:var(--pink)}
.step b{display:block}
.step span{color:var(--lav);font-size:14px}
a{color:var(--cyan)}
/* sharing */
.share{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px}
.sbtn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;cursor:pointer;
  font:600 13px var(--label);letter-spacing:.06em;text-transform:uppercase;padding:8px 14px;text-decoration:none}
.sbtn.main{background:var(--pink);color:#fff}
.sbtn.alt{background:var(--card2);color:#fff}
.sbtn svg{width:15px;height:15px;fill:currentColor}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:var(--deep);
  font:600 14px Inter;padding:10px 16px;border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.35);opacity:0;
  transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
.fulltest{display:block;margin-top:6px;font-weight:600;text-decoration:none}
/* inside a card the carousel needs no gap of its own before the share bar */
.card .caps{margin-bottom:0}
@media (max-width:520px){
  h1{font-size:32px}
  .row{grid-template-columns:22px minmax(0,1fr) 36px 129px;gap:6px}
  .xp{font-size:20px}
  .racer .pct{font-size:28px}
  .stat b{font-size:22px}
  .hide-s{display:none}
  .show-s{display:inline}
  .pl td,.pl th{padding:8px 3px}
  .pl{font-size:13.5px}
  .pl td:first-child .l1 b{max-width:100px}
  .pl .xp{font-size:16px}
}
@media (max-width:360px){
  /* smallest phones (iPhone SE): the position filter chips already say the position */
  .pl{font-size:12.5px}
  .pl td,.pl th{padding:7px 2px}
  .pl td:first-child .l1 .tag{display:none}
  .pl td:first-child .l1 b{max-width:84px}
  .pl td:first-child .sub .dot{display:none}
  .pl .sep:before{content:' '}
  .pl .xp{font-size:15px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Premier League Supercomputer</div>
    <div class="titlebar"><h1>2026-27 <b>Predictions</b></h1>
      <button class="zone" id="zone" data-zone="1" aria-label="Show times in your time zone or UTC"></button></div>
    <div class="meta" id="meta"></div>
  </header>
  <nav class="tabs" role="tablist">
    <button class="tab" data-t="table" aria-selected="true">Table</button>
    <button class="tab" data-t="matches" aria-selected="false">Matches</button>
    <button class="tab" data-t="fpl" aria-selected="false">FPL<span class="new">NEW</span></button>
    <button class="tab" data-t="about" aria-selected="false">About</button>
  </nav>
  <main id="app"></main>
</div>
<script>
let M = {trend: {}}, D = {};
const CLUB={"Arsenal":"#EF0107","Manchester City":"#6CABDD","Liverpool":"#C8102E","Manchester United":"#DA291C",
"Bournemouth":"#DA291C","Aston Villa":"#95BFE5","Newcastle United":"#5B6B77","Brighton":"#0057B8","Chelsea":"#034694",
"Leeds":"#FFCD00","Brentford":"#E30613","Crystal Palace":"#1B458F","Nottingham Forest":"#DD0000","Tottenham":"#4A5D8F",
"Everton":"#003399","Fulham":"#CC0000","Sunderland":"#EB172B","Hull":"#F5A12D","Coventry":"#78D0F3","Ipswich":"#0044A9"};
const SHORT={"Manchester City":"Man City","Manchester United":"Man Utd","Newcastle United":"Newcastle","Nottingham Forest":"Nott'm Forest","Crystal Palace":"Palace","Aston Villa":"Villa"};
const nm = t => SHORT[t] || t;
const CODE = {"Arsenal":"ARS","Aston Villa":"AVL","Bournemouth":"BOU","Brentford":"BRE","Brighton":"BHA","Chelsea":"CHE",
"Coventry":"COV","Crystal Palace":"CRY","Everton":"EVE","Fulham":"FUL","Hull":"HUL","Ipswich":"IPS","Leeds":"LEE",
"Liverpool":"LIV","Manchester City":"MCI","Manchester United":"MUN","Newcastle United":"NEW","Nottingham Forest":"NFO",
"Sunderland":"SUN","Tottenham":"TOT"};
const code = t => CODE[t] || String(t).slice(0, 3).toUpperCase();
const pct = (v, d=0) => v >= 0.995 ? '>99%' : v < 0.005 && v > 0 ? '<1%' : v === 0 ? '–' : (100*v).toFixed(d)+'%';
const col = t => CLUB[t] || '#888';
const dot = t => `<span class="dot" style="background:${col(t)}"></span>`;
// Times in the visitor's own zone or UTC, their choice, remembered.
let useUTC = false;
try { useUTC = localStorage.getItem('plzone') === 'utc'; } catch (e) {}
const zoneName = () => useUTC ? 'UTC' : (new Intl.DateTimeFormat(navigator.language || 'en-GB', {timeZoneName: 'short'})
  .formatToParts(new Date()).find(p => p.type === 'timeZoneName') || {}).value || 'local';
const ko = s => s ? new Date(s).toLocaleString('en-GB', Object.assign({weekday:'short',day:'numeric',month:'short',
  hour:'2-digit',minute:'2-digit',hour12:false}, useUTC ? {timeZone: 'UTC'} : {})) : '';
let TAB = 'table', VIEW = 'pred', GW = null, POS = 'ALL', HZ = 'x1', SHOWN = 40, FV = 'picks';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const localName = () => (new Intl.DateTimeFormat(navigator.language || 'en-GB', {timeZoneName: 'short'})
  .formatToParts(new Date()).find(p => p.type === 'timeZoneName') || {}).value || 'Local';
const setMeta = () => {
  document.getElementById('meta').innerHTML =
    `After <b>Gameweek ${D.gameweek}</b> · updated ${ko(D.updated_utc)} · next update after GW${D.next_gameweek}`;
  document.getElementById('zone').innerHTML =
    `<span class="${useUTC ? '' : 'on'}">${esc(localName())}</span><span class="${useUTC ? 'on' : ''}">UTC</span>`;
};

/* -------------------------------------------------------------- SHARING */
// Phones get their own share sheet (WhatsApp, Instagram, Messages...);
// computers, which mostly lack one, get WhatsApp, X and copy-link buttons.
const SITE = 'https://shanbhag003.github.io/pl-supercomputer/';
const ICON = {
  share: '<svg viewBox="0 0 24 24"><path d="M18 16a3 3 0 0 0-2.4 1.2l-6.7-3.4a3 3 0 0 0 0-1.6l6.7-3.4A3 3 0 1 0 15 7l-6.7 3.4a3 3 0 1 0 0 3.2L15 17a3 3 0 1 0 3-1z"/></svg>',
  wa: '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.3-.8-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.4 1.8 2.2 1.2 1 2.2 1.4 2.5 1.5.3.2.5.1.7-.1l.9-1.1c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.6.3.1.2.1.8-.2 1.4z"/></svg>',
  x: '<svg viewBox="0 0 24 24"><path d="M17.8 3h3.1l-6.8 7.7L22 21h-6.2l-4.9-6.3L5.3 21H2.2l7.2-8.3L1.8 3h6.4l4.4 5.8L17.8 3zm-1.1 16.2h1.7L7.4 4.7H5.6l11.1 14.5z"/></svg>',
  link: '<svg viewBox="0 0 24 24"><path d="M10.6 13.4a1 1 0 0 1 0-1.4l3.4-3.4a3 3 0 0 1 4.2 4.2l-2 2a1 1 0 0 1-1.4-1.4l2-2a1 1 0 0 0-1.4-1.4l-3.4 3.4a1 1 0 0 1-1.4 0zm2.8-2.8a1 1 0 0 1 0 1.4L10 15.4a3 3 0 0 1-4.2-4.2l2-2a1 1 0 0 1 1.4 1.4l-2 2a1 1 0 0 0 1.4 1.4l3.4-3.4a1 1 0 0 1 1.4 0z"/></svg>'
};
const canNative = !!navigator.share && matchMedia('(pointer:coarse)').matches;
function shareBar(text, label = 'Share'){
  const t = encodeURIComponent(text), u = encodeURIComponent(SITE);
  const enc = encodeURIComponent(text).replace(/'/g, '%27');
  if (canNative) return `<div class="share"><button class="sbtn main" data-share="${enc}">${ICON.share}${label}</button></div>`;
  return `<div class="share">
    <a class="sbtn main" target="_blank" rel="noopener" href="https://wa.me/?text=${t}%20${u}">${ICON.wa}WhatsApp</a>
    <a class="sbtn alt" target="_blank" rel="noopener" href="https://twitter.com/intent/tweet?text=${t}&url=${u}">${ICON.x}Post</a>
    <button class="sbtn alt" data-copy="1">${ICON.link}Copy link</button></div>`;
}
function toast(msg, ms = 1800){
  let el = document.querySelector('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), ms);
}
const raceText = () => D.teams.slice(0, 3).map(t => `${nm(t.team)} ${pct(t.title)}`).join(' · ')
  + ` to win the Premier League, after ${D.n_sims.toLocaleString()} simulations. Who's your money on?`;
// only the chances that are real - "0% relegation" reads oddly in a message
const clubText = t => `${nm(t.team)}: ` + [
  t.title >= 0.005 && `${pct(t.title)} to win the league`,
  t.top4 >= 0.005 && `${pct(t.top4)} top four`,
  t.releg >= 0.005 && `${pct(t.releg)} relegation risk`,
  `about ${Math.round(t.xPts)} points`].filter(Boolean).join(', ') + '. Full predictions:';

/* ---------------------------------------------------------------- TABLE */
function trendChart(){
  // drawn at the card's real width, so labels stay readable on a phone
  const W = Math.max(300, Math.min(720, (document.getElementById('app').clientWidth || 360) - 34));
  const H = W < 480 ? 190 : 220, L = 34, R = W < 480 ? 92 : 110, T = 12, B = 26;
  // the saved gameweek forecasts, ending on the latest one shown in the cards
  // above (a refresh can move it after the gameweek's own forecast)
  const now = Object.fromEntries(D.teams.map(t => [t.team, t.title]));
  const series = Object.entries(M.trend).slice(0, 4)
    .map(([t, s]) => [t, s.slice(0, -1).concat([[s[s.length - 1][0], now[t] ?? s[s.length - 1][1]]])]);
  const gws = series[0][1].map(p => p[0]);
  const maxY = Math.max(0.5, ...series.flatMap(([, s]) => s.map(p => p[1])));
  const x = g => L + (W - L - R) * (g - gws[0]) / Math.max(1, gws[gws.length - 1] - gws[0]);
  const y = v => T + (H - T - B) * (1 - v / maxY);
  let g = '';
  for (let v = 0; v <= maxY + 1e-9; v += 0.1) g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.08)"/><text x="${L-6}" y="${y(v)+4}" font-size="11" text-anchor="end">${Math.round(v*100)}%</text>`;
  gws.forEach((gw, i) => g += `<text x="${x(gw)}" y="${H-8}" font-size="11" text-anchor="middle">${i === gws.length - 1 ? 'Now' : gw === 0 ? 'Pre' : 'GW'+gw}</text>`);
  // end labels, nudged apart so close finishers don't overlap
  const ends = series.map(([t, s]) => ({t, v: s[s.length-1][1], y: y(s[s.length-1][1])})).sort((a,b) => a.y - b.y);
  for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i-1].y < 14) ends[i].y = ends[i-1].y + 14;
  series.forEach(([t, s], i) => {
    const d = s.map((p, j) => `${j ? 'L' : 'M'}${x(p[0])},${y(p[1])}`).join('');
    const w = i < 2 ? 3 : 1.6;
    g += `<path d="${d}" fill="none" stroke="${col(t)}" stroke-width="${w}" stroke-linejoin="round" opacity="${i < 3 ? 1 : .6}"/>`;
  });
  ends.forEach(e => g += `<text x="${W-R+8}" y="${e.y+4}" font-size="12" style="fill:${col(e.t)};font-weight:600">${nm(e.t)} ${pct(e.v)}</text>`);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block" role="img" aria-label="Title chances over the season">${g}</svg>`;
}

function tableTab(){
  const top = D.teams.slice(0, 3);
  let h = `<div class="card"><div class="h2">The title race <small>chance of winning the league</small></div>
    <div class="race">${top.map(t => `<div class="racer" style="border-color:${col(t.team)}">
      <div class="pct">${pct(t.title)}</div><div class="nm">${nm(t.team)}</div>
      <div class="sub">${t.pts_now} pts now · ~${Math.round(t.xPts)} final</div></div>`).join('')}</div>
    ${Object.keys(M.trend).length ? trendChart() : ''}
    ${shareBar(raceText(), 'Share the title race')}</div>`;

  // what changed - shown, not hidden
  if (D.moves && D.moves.length){
    h += `<div class="card"><div class="h2">What changed this week <small>since Gameweek ${D.gameweek-1}</small></div>
      ${D.model_note ? `<div class="note">${D.model_note}</div>` : ''}
      ${D.moves.slice(0,3).map(m => `<div class="mv"><div>${dot(m.team)}<b>${nm(m.team)}</b><em>${m.reason||''}</em></div>
        <div class="${m.d_xPts > 0 ? 'up' : 'dn'}">${m.d_xPts > 0 ? '+' : ''}${m.d_xPts.toFixed(1)}</div></div>`).join('')}</div>`;
  }

  h += `<div class="chips"><button class="chip ${VIEW==='pred'?'on':''}" data-v="pred">Predicted final table</button>
        <button class="chip ${VIEW==='cur'?'on':''}" data-v="cur">Table now</button></div>`;
  if (VIEW === 'pred'){
    const lo = 20, hi = 95, sx = v => 100 * (v - lo) / (hi - lo);
    h += `<div class="card"><div class="h2">Predicted final table <small>tap a club for every finishing position</small></div>
      <div class="row hdr"><span></span><span>Club</span><span style="text-align:right">Pts</span>
      <span class="odds"><span>Title</span><span>Top 4</span><span>Down</span></span></div>`;
    D.teams.forEach((t, i) => {
      const zone = i < 4 ? 'var(--green)' : i < 6 ? 'var(--cyan)' : i >= 17 ? 'var(--pink)' : 'transparent';
      const pm = D.position_matrix[t.team] || [];
      const mx = Math.max(...pm, 0.01);
      // onclick="" on the row itself: iOS only turns a tap into a click on a
      // plain element that has a click handler of its own; the document-level
      // listener below then handles it
      h += `<div class="row" style="--zone:${zone}" data-team="${t.team}" onclick="" role="button" aria-expanded="false">
        <span class="pos">${t.pos}</span>
        <span class="team">${dot(t.team)}${nm(t.team)}<span class="sub">${t.pts_now} pts from ${t.played}</span></span>
        <span class="xp">${t.xPts.toFixed(0)}</span>
        <span class="odds"><span class="t">${pct(t.title)}</span><span>${pct(t.top4)}</span><span class="r">${pct(t.releg)}</span></span>
        <div class="rng" title="80% likely range ${t.lo}-${t.hi}"><i style="left:${sx(t.lo)}%;width:${sx(t.hi)-sx(t.lo)}%;background:${col(t.team)}"></i><b style="left:${sx(t.xPts)}%"></b></div>
        <div class="dist"><div class="h2" style="margin-bottom:6px">Chance of finishing in each position <small>likely range ${t.lo}–${t.hi} pts</small></div>
          <div class="bars">${pm.map((v, k) => `<i class="${k<4?'z1':k>=17?'z3':''}" style="height:${100*v/mx}%" title="${k+1}: ${pct(v,1)}"></i>`).join('')}</div>
          <div class="axis"><span>1st</span><span>10th</span><span>20th</span></div>
          ${shareBar(clubText(t), `Share ${nm(t.team)}'s chances`)}</div>
      </div>`;
    });
    h += `<div class="legend"><span><i style="background:var(--green)"></i>Top 4</span><span><i style="background:var(--cyan)"></i>Top 6</span>
      <span><i style="background:var(--pink)"></i>Relegation</span><span>Bar under each club: the 80% likely points range</span></div></div>`;
  } else {
    h += `<div class="card"><table class="cur"><tr><th>#</th><th>Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th class="hide-s">GF</th><th class="hide-s">GA</th><th>GD</th><th>Pts</th></tr>
      ${D.actual.map((r, i) => `<tr style="box-shadow:inset 3px 0 0 ${i < 4 ? 'var(--green)' : i < 6 ? 'var(--cyan)' : i >= 17 ? 'var(--pink)' : 'transparent'}"><td>${r.pos}</td><td>${dot(r.team)}${nm(r.team)}</td><td>${r.P}</td><td>${r.W}</td><td>${r.D}</td><td>${r.L}</td>
        <td class="hide-s">${r.GF}</td><td class="hide-s">${r.GA}</td><td>${r.GD > 0 ? '+' : ''}${r.GD}</td><td><b>${r.Pts}</b></td></tr>`).join('')}</table>
      <div class="legend"><span><i style="background:var(--green)"></i>Top 4</span><span><i style="background:var(--cyan)"></i>Top 6</span>
      <span><i style="background:var(--pink)"></i>Relegation</span></div></div>`;
  }
  return h;
}

/* -------------------------------------------------------------- MATCHES */
function matchesTab(){
  const v = D.validation || {}, done = D.matches.filter(m => m.res_h !== undefined);
  const right = done.filter(m => m.ok_outcome).length;
  const gap = v.bookie_rps ? 100 * ((v.model_rps_same ?? v.rps) / v.bookie_rps - 1) : null;
  let h = `<div class="stats">
    <div class="stat"><b>${right}/${done.length}</b><span>results called right</span></div>
    <div class="stat"><b>${(v.rps||0).toFixed(3)}</b><span>sharpness score (bookies ${v.bookie_rps ? v.bookie_rps.toFixed(3) : '–'})</span></div>
    <div class="stat"><b style="color:${gap !== null && gap <= 0 ? 'var(--green)' : 'var(--pink)'}">${gap === null ? '–' : Math.abs(gap).toFixed(1)+'%'}</b>
      <span>${gap === null ? '' : gap <= 0 ? 'ahead of the betting market' : 'behind the betting market'}</span></div></div>`;
  const gws = [...new Set(D.matches.map(m => m.gw))].sort((a,b) => a-b);
  h += `<div class="chips">${gws.map(g => `<button class="chip ${g===GW?'on':''}" data-gw="${g}">GW${g}</button>`).join('')}</div>`;
  D.matches.filter(m => m.gw === GW).forEach(m => {
    const played = m.res_h !== undefined;
    const badge = played ? `<span class="res ${m.ok_outcome?'y':'n'}">${m.res_h}–${m.res_a} ${m.ok_outcome?'✓ called':'✗'}</span>`
                         : `<span class="res w">not played yet</span>`;
    const sc = m.sc_h !== undefined ? `${m.sc_h}–${m.sc_a}<small>${m.xg_h !== undefined ? `xG ${(+m.xg_h).toFixed(1)}–${(+m.xg_a).toFixed(1)}` : 'most likely'}</small>` : '<small>—</small>';
    h += `<div class="fx"><div class="ko"><span>${ko(m.ko)}${m.close ? ' · <span class="tight">too close to call</span>' : ''}</span>${badge}</div>
      <div class="teams"><div>${dot(m.home)}<b>${nm(m.home)}</b></div><div class="sc">${sc}</div><div><b>${nm(m.away)}</b><span class="dot" style="background:${col(m.away)};margin:0 0 0 8px"></span></div></div>
      <div class="pbar"><i style="width:${100*m.pH}%;background:${col(m.home)}"></i><i style="width:${100*m.pD}%;background:#7A6E86"></i><i style="width:${100*m.pA}%;background:${col(m.away)}"></i></div>
      <div class="plab"><span>${pct(m.pH)} home win</span><span>${pct(m.pD)} draw</span><span>${pct(m.pA)} away win</span></div></div>`;
  });
  return h;
}

/* ------------------------------------------------------------------ FPL */
function fplTab(){
  const F = D.fpl;
  if (!F || !F.players || !F.players.length)
    return '<div class="card">FPL predictions appear here before each gameweek.</div>';
  const last = HZ === 'x1' ? F.gws[0] : HZ === 'x3' ? F.gws[Math.min(2, F.gws.length - 1)] : F.gws[F.gws.length - 1];
  const span = HZ === 'x1' ? `GW${F.gws[0]}` : `GW${F.gws[0]}–${last}`;
  const fix = r => r.next.filter(n => n.gw === F.gws[0]).map(n => `${n.home ? 'v' : '@'} ${code(n.opp)}`).join(', ') || '–';
  const fixLong = r => r.next.filter(n => n.gw === F.gws[0]).map(n => `${n.home ? 'v' : '@'} ${nm(n.opp)}`).join(', ') || 'no game';
  const flag = (r, short) => r.status === 'a' ? '' : ` <button class="flagbtn${short ? ' short' : ''}" data-news="${esc(r.news || 'No details from FPL')}" aria-label="Injury news">${
    short ? '!' : {d: 'doubt', i: 'injured', s: 'suspended'}[r.status] || 'out'}</button>`;
  const rows = F.players.filter(r => POS === 'ALL' || r.pos === POS).sort((a, b) => b[HZ] - a[HZ]);
  const caps = [...F.players].sort((a, b) => b.x1 - a.x1).slice(0, 5);
  const shown = rows.slice(0, SHOWN);
  const n = (F.record || []).length;
  let h = `<div class="chips"><button class="chip ${FV === 'picks' ? 'on' : ''}" data-fv="picks">Expected points</button>
    <button class="chip ${FV === 'record' ? 'on' : ''}" data-fv="record">Track record${n ? ` · ${n} GW${n > 1 ? 's' : ''}` : ''}</button></div>`;
  if (FV === 'record') return h + fplRecord(F);
  h += `<div class="note">Expected FPL points for every player, from the model's predicted goals for each fixture,
    each player's share of his team's chances, his minutes and FPL's injury news. Deadline <b>${ko(F.deadline)}</b>.
    Tested on five past seasons: the model's top-10 picks scored 0.7 points per player per gameweek more than picking on form.</div>`;
  h += `<div class="card"><div class="h2">Captain picks <small>highest expected points, GW${F.gws[0]}</small></div><div class="caps">
    ${caps.map(r => `<div class="cap" style="border-color:${col(r.club)}"><div class="x">${r.x1.toFixed(1)}</div>
      <div class="nm">${esc(r.name)}${flag(r)}</div><div class="sub">${code(r.club)} · ${r.pos} · £${r.price.toFixed(1)}m</div>
      <div class="sub">${fixLong(r)}</div><div class="sub">xG ${r.eg.toFixed(2)} · xA ${r.ea.toFixed(2)}</div></div>`).join('')}</div>`;
  h += shareBar(`FPL captain picks for GW${F.gws[0]}: ${caps.slice(0, 3).map(r => `${r.name} ${r.x1.toFixed(1)}`).join(', ')}`
    + ' expected points — from a model that simulates every fixture. Full list:', 'Share captain picks') + '</div>';
  h += `<div class="card"><div class="chips">${[['x1', 'Next gameweek'], ['x3', 'Next 3'], ['x5', 'Next 5']].map(([k, l]) =>
      `<button class="chip ${HZ === k ? 'on' : ''}" data-hz="${k}">${l}</button>`).join('')}</div>
    <div class="chips">${['ALL', 'GKP', 'DEF', 'MID', 'FWD'].map(p => `<button class="chip ${POS === p ? 'on' : ''}" data-pos="${p}">${p}</button>`).join('')}</div>
    <div class="plw"><table class="pl"><tr><th>Player</th><th class="hide-s">GW${F.gws[0]}</th><th>xG</th><th>xA</th><th>CS</th><th>Pts ${span}</th><th class="hide-s">Owned</th><th class="hide-s">per £m</th></tr>
    ${shown.map(r => `<tr><td><div class="l1"><b>${esc(r.name)}</b> <span class="tag">${r.pos}</span>${flag(r, true)}</div><span class="sub">${dot(r.club)}${code(r.club)}<span class="sep"></span>£${r.price.toFixed(1)}m<span class="show-s"><span class="sep"></span>${fix(r)}</span></span></td>
      <td class="fx1 hide-s">${fix(r)}</td><td>${r.eg.toFixed(2)}</td><td>${r.ea.toFixed(2)}</td><td>${r.pos === 'FWD' ? '–' : pct(r.cs)}</td>
      <td class="xp">${r[HZ].toFixed(1)}</td><td class="hide-s">${r.own.toFixed(1)}%</td><td class="hide-s">${(r[HZ] / r.price).toFixed(2)}</td></tr>`).join('')}</table></div>
    ${rows.length > shown.length ? `<button class="chip" data-more="1" style="margin-top:12px">Show ${Math.min(40, rows.length - shown.length)} more</button>` : ''}
    <div class="legend">Showing ${shown.length} of ${rows.length}${POS === 'ALL' ? '' : ' ' + POS} players with a realistic chance of points.
      xG, xA and CS (clean-sheet chance; forwards score nothing for one) are for GW${F.gws[0]}.${
      shown.some(r => r.status !== 'a') ? ' Tap a yellow tag for FPL&#39;s injury news.' : ''}</div></div>`;
  return h;
}

// Our frozen pre-deadline picks against what happened, beside FPL's own
// expected points - the FPL version of the match scorecard.
function fplRecord(F){
  const R = F.record || [];
  let h = `<div class="card"><div class="h2">Track record <small>our picks vs what happened</small></div>`;
  if (!R.length) return h + `<div class="legend" style="margin-top:0;font-size:13.5px;line-height:1.6">Every gameweek our
    expected points are frozen at the deadline, beside FPL's own. Once the gameweek is played, our captain and top-10 picks
    are scored here against what they actually got, with FPL's picks alongside, so you can judge both.
    <br><br><b style="color:#fff">First results after GW${F.gws[0]}.</b></div></div>`;
  const avg = k => R.reduce((s, r) => s + k(r), 0) / R.length;
  const tile = (v, l, good) => `<div class="stat"><b style="color:${good ? 'var(--green)' : '#fff'}">${v}</b><span>${l}</span></div>`;
  const ours = avg(r => r.ours_top10), fpl = avg(r => r.fpl_top10), oc = avg(r => r.our_cap.pts), fc = avg(r => r.fpl_cap.pts);
  h += `<div class="stats">${tile(ours.toFixed(1), `our top-10, avg pts (FPL's ${fpl.toFixed(1)})`, ours >= fpl)}
    ${tile(oc.toFixed(1), `our captain, avg pts (FPL's ${fc.toFixed(1)})`, oc >= fc)}
    ${tile(R.length, R.length === 1 ? 'gameweek scored' : 'gameweeks scored', false)}</div>`;
  const line = r => `<details class="rec"><summary><b>GW${r.gw}</b>
      <span>C: ${esc(r.our_cap.name)} <i>${r.our_cap.x}→</i><em class="${r.our_cap.pts >= r.fpl_cap.pts ? 'up' : 'dn'}">${r.our_cap.pts}</em></span>
      <span class="hide-s">FPL's C: ${esc(r.fpl_cap.name)} <i>${r.fpl_cap.x}→</i>${r.fpl_cap.pts}</span>
      <span>top-10 <em class="${r.ours_top10 >= r.fpl_top10 ? 'up' : 'dn'}">${r.ours_top10.toFixed(1)}</em> v ${r.fpl_top10.toFixed(1)}</span></summary>
    <table class="pl"><tr><th>Our top 10</th><th>Expected</th><th>Actual</th></tr>
      ${r.picks.map(p => `<tr><td>${dot(p.club)}${esc(p.name)} <span class="tag">${p.pos}</span></td><td>${p.x.toFixed(1)}</td><td class="act ${p.pts >= p.x ? 'up' : 'dn'}">${p.pts}</td></tr>`).join('')}</table>
    <div class="legend">FPL's own captain pick: ${esc(r.fpl_cap.name)}, ${r.fpl_cap.x} expected, ${r.fpl_cap.pts} scored.
      Best possible top 10 with hindsight: ${r.best_top10.toFixed(1)} avg.</div></details>`;
  h += R.map(line).join('');
  return h + `<div class="legend">Predictions are frozen at each deadline and never edited. Top-10 is the average points
    of the ten players each method rated highest, benched players included.</div></div>`;
}

/* --------------------------------------------------------------- render */
function render(){
  document.getElementById('app').innerHTML =
    TAB === 'table' ? tableTab() : TAB === 'matches' ? matchesTab() : TAB === 'fpl' ? fplTab() : aboutTab();
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.t === TAB));
}
document.addEventListener('click', e => {
  // share buttons sit inside table rows, so handle them first and stop there
  const fb = e.target.closest('[data-news]');
  if (fb) { toast(fb.dataset.news, 4000); return; }
  const more = e.target.closest('[data-more]');
  if (more) { SHOWN += 40; render(); return; }
  const s = e.target.closest('[data-share],[data-copy],.share a');
  if (s) {
    e.stopPropagation();
    if (s.dataset.share) navigator.share({title: 'PL Supercomputer', text: decodeURIComponent(s.dataset.share), url: SITE}).catch(() => {});
    else if (s.dataset.copy) navigator.clipboard.writeText(SITE).then(() => toast('Link copied'), () => toast(SITE));
    return;
  }
  const t = e.target.closest('[data-t],[data-v],[data-gw],[data-pos],[data-hz],[data-zone],[data-fv],.row[data-team]');
  if (!t) return;
  if (t.dataset.t) { TAB = t.dataset.t; render(); window.scrollTo({top: 0}); }
  else if (t.dataset.v) { VIEW = t.dataset.v; render(); }
  else if (t.dataset.gw) { GW = +t.dataset.gw; render(); }
  else if (t.dataset.pos) { POS = t.dataset.pos; SHOWN = 40; render(); }
  else if (t.dataset.hz) { HZ = t.dataset.hz; SHOWN = 40; render(); }
  else if (t.dataset.fv) { FV = t.dataset.fv; render(); }
  else if (t.dataset.zone) {
    useUTC = !useUTC;
    try { localStorage.setItem('plzone', useUTC ? 'utc' : 'local'); } catch (e) {}
    setMeta(); render();
  }
  else if (t.dataset.team) t.classList.toggle('open');
});
fetch('data.json?v=' + Date.now()).then(r => r.json()).then(d => {
  D = d; M = {trend: d.title_trend || {}};
  const gws = [...new Set((d.matches || []).map(m => m.gw))];
  GW = gws.includes(d.next_gameweek) ? d.next_gameweek : Math.max(...gws, 1);
  setMeta(); render();
}).catch(() => { document.getElementById('app').innerHTML =
  '<div class="card">The predictions could not be loaded. Please refresh in a moment.</div>'; });
</script>
</body>
