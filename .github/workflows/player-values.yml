name: Player values (yearly)

# Rebuilds data/processed/rapm_live.pkl - the player values the squad layer
# uses - once the season is over, so they always include the latest complete
# season. Without this the values silently go a season stale every summer and
# new signings never get one. See src/build_player_values.py and VALIDATION.md
# section 16.
on:
  schedule:
    # 10 June, 05:00 UTC: two weeks after the last round, before the
    # pre-season forecast is built.
    - cron: '0 5 10 6 *'
  workflow_dispatch:

permissions:
  contents: write

# Same group as the weekly pipeline: both commit to main, so they queue rather
# than race each other.
concurrency:
  group: pl-supercomputer
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # Understat labels a season by the year it starts, so in June the season
      # that just finished is last year's. Both downloads only fetch matches
      # not already cached.
      - name: Top up lineups and shots
        run: |
          LAST=$(( $(date -u +%Y) - 1 ))
          python scripts/pull_understat_rosters.py $((LAST - 1)) $LAST
          python scripts/pull_understat_shots.py $((LAST - 1)) $LAST

      # Exits with an error, writing nothing, if the new values fail the
      # sanity check against the current file - so a bad download can never
      # replace good values. The job then shows red in the Actions tab.
      - name: Rebuild player values
        run: python src/build_player_values.py

      # Last season's final FPL appearances and defensive-contribution rates,
      # so the FPL minutes model works from Gameweek 1 (src/fpl_live.py).
      # From the vaastav archive; a failure here leaves last year's file.
      - name: Rebuild FPL last-season file
        continue-on-error: true
        run: |
          LAST=$(( $(date -u +%Y) - 1 ))
          LABEL="$LAST-$(( (LAST + 1) % 100 ))"
          mkdir -p data/fpl_history
          BASE=https://raw.githubusercontent.com/vaastav/Fantasy-Premier-League/master/data/$LABEL
          curl -sfL -o data/fpl_history/merged_gw_$LABEL.csv $BASE/gws/merged_gw.csv
          curl -sfL -o data/fpl_history/players_raw_$LABEL.csv $BASE/players_raw.csv
          python -c "import sys; sys.path.insert(0, 'src'); import fpl_live; fpl_live.build_prev_season('$LABEL')"

      - name: Commit
        run: |
          git config user.name  "pl-supercomputer"
          git config user.email "actions@github.com"
          git add data/processed/rapm_live.pkl data/processed/fpl_prev_season.parquet data/understat/ || true
          git diff --staged --quiet && echo "nothing to commit" || {
            git commit -m "Player values rebuilt $(date -u +'%Y-%m-%d')"
            git pull --rebase && git push
          }
