name: PL Supercomputer

on:
  schedule:
    # ── publish ───────────────────────────────────────────────────────────
    # Poll every 2h. The gate lets it through 3h after a gameweek settles,
    # and exits in ~2s otherwise. This is the ONLY schedule that publishes.
    - cron: '17 */2 * * *'

    # ── refresh ───────────────────────────────────────────────────────────
    # Every schedule below rebuilds the site with current squad data and
    # sends no email. See REFRESH_ONLY under "Run model" - the logic is
    # "any schedule that is not the 2-hourly poll", so new refresh crons can
    # be added here without touching it.

    # Daily, 06:00 UTC. Team news, injuries, suspensions and transfers land
    # continuously, and a fixture's prediction freezes the moment it kicks
    # off - so a weekly refresh could leave a Friday-night kickoff frozen on
    # Wednesday's squad data. Daily keeps the worst case at ~24h.
    - cron: '0 6 * * *'

    # Friday 09:00 UTC, a second pass before Friday-evening kickoffs (which
    # are typically 19:00 UTC). Not 17:00: GitHub delays scheduled runs by
    # 20-30 minutes fairly often, and a two-hour margin can vanish. Friday
    # morning team news is settled enough, and this buys ten hours instead.
    - cron: '0 9 * * 5'

    # Tuesday 09:00 UTC, the same for the five midweek rounds.
    - cron: '0 9 * * 2'

  workflow_dispatch:
    inputs:
      force:
        description: 'Publish even if no gameweek has settled'
        type: boolean
        default: false
      refresh:
        description: 'Rebuild the site with current squad data, no email'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pl-supercomputer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run model
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          FORCE_RUN: ${{ inputs.force }}
          # Stated as "a scheduled run that is NOT the 2-hourly poll", rather
          # than by listing the refresh crons. Listing them meant every new
          # refresh schedule had to be added here too, and forgetting would
          # silently turn it into a publish run that exits at the gate without
          # rebuilding anything. The event_name guard matters: on a manual
          # dispatch github.event.schedule is empty, so without it every
          # dispatch would be treated as a refresh and ignore the toggle.
          REFRESH_ONLY: ${{ (github.event_name == 'schedule' && github.event.schedule != '17 */2 * * *') || inputs.refresh }}
        run: python src/update.py

      - name: Commit results
        run: |
          git config user.name  "pl-supercomputer"
          git config user.email "actions@github.com"
          git add outputs/ docs/ data/understat/ data/raw/ || true
          git diff --staged --quiet && echo "nothing to commit" || {
            git commit -m "Update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase && git push
          }
