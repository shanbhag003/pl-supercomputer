name: PL Supercomputer

on:
  schedule:
    # publish: poll every 2h, gate lets it through 5h after a gameweek settles
    - cron: '17 */2 * * *'
    # refresh: Friday 17:00 UTC, after the week's team news has landed
    - cron: '0 17 * * 5'
    # refresh: Tuesday 17:00 UTC, for the five midweek rounds
    - cron: '0 17 * * 2'
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish even if no gameweek has settled'
        type: boolean
        default: false
      refresh:
        description: 'Rebuild the site with current squad data, no email'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pl-supercomputer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run model
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          FORCE_RUN: ${{ inputs.force }}
          # the two 17:00 crons are team-news refreshes; the 2-hourly one is not
          REFRESH_ONLY: ${{ github.event.schedule == '0 17 * * 5' || github.event.schedule == '0 17 * * 2' || inputs.refresh }}
        run: python src/update.py

      - name: Commit results
        run: |
          git config user.name  "pl-supercomputer"
          git config user.email "actions@github.com"
          git add outputs/ docs/ data/understat/ data/raw/ || true
          git diff --staged --quiet && echo "nothing to commit" || {
            git commit -m "Update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase && git push
          }
